[build-system]
requires = ["setuptools>=84.0.0", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot-maven-tools-agent"
version = "0.1.0"
description = "Automated dependency management using direct Maven Tools MCP calls and Copilot major-review mode"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Arvind Menon"}
]
keywords = ["copilot", "mcp", "maven", "dependencies", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "aiohttp>=3.14.3,<4",
    "pydantic>=2.13.5,<3",
    "click>=8.5.0,<9",
    "rich>=15.0.0,<16",
    "github-copilot-sdk==1.0.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.1.0,<8",
    "black>=26.5.1",
    "ruff>=0.16.10,<0.17",
    "mypy>=2.4.0,<3",
]

[project.scripts]
maven-agent = "scripts.upgrade:main"

[project.urls]
Homepage = "https://github.com/arvindand/maven-tools-mcp"
Repository = "https://github.com/arvindand/maven-tools-mcp"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
